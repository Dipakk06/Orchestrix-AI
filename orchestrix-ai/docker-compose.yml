version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orchestrix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - '8001:8000'
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
